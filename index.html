<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Members Portal</title>
<meta property="og:title" content="Members Portal">
<meta property="og:description" content="รายชื่อสมาชิก">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Orbitron:wght@900&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0a0a0b; --surf:#16161a; --surf2:#1f1f24; --ink:#fff; --muted:#9a9ea6; --line:rgba(255,255,255,.1);
  --fb:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif; --fh:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif; --fm:'Orbitron',var(--fb);
  --acc:#e11d2e; --glow:color-mix(in srgb,var(--acc) 45%,transparent);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:90px;scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);min-height:100vh;overflow-x:hidden}
button,input,select{font-family:inherit}
.mark{position:fixed;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;z-index:0;font-family:var(--fm);font-weight:900;color:rgba(255,255,255,.04);line-height:1.05}
.mark b{font-size:min(15vw,230px);white-space:nowrap}
.mark i{font-style:normal;font-size:min(4.5vw,64px);letter-spacing:.2em;margin-top:6px}
.snow{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.snow canvas{width:100%;height:100%;display:block}
.page{position:relative;z-index:2}
h1{margin:0;font-family:var(--fh);font-weight:800;font-size:clamp(34px,9vw,84px);letter-spacing:.09em;line-height:1}
.sub{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:20px;color:var(--acc);font-size:13px;letter-spacing:.2em}
.sub:before,.sub:after{content:"";width:46px;height:1px;background:var(--acc);opacity:.7}

/* ===== หัวเว็บ + ชื่อแก๊งค์มีลูกเล่น ===== */
header{text-align:center;padding:72px 20px 40px;perspective:900px}
.logo{width:var(--ls,150px);height:var(--ls,150px);margin:0 auto 22px;color:var(--acc);filter:drop-shadow(0 0 10px var(--glow));object-fit:contain;display:block}
.titlewrap{display:inline-block;max-width:100%;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out}
#brand{position:relative}
#brand .w{display:inline-block;white-space:nowrap}
.ch{display:inline-block;opacity:0;transform-origin:50% 100%;transition:translate .22s ease-out,scale .22s ease-out;will-change:transform}
body.entered .ch{animation:chIn .95s calc(var(--i)*.075s + .25s) cubic-bezier(.2,.9,.2,1.15) both,wave 2.8s calc(var(--i)*.15s + 1.7s) ease-in-out 1}
body.entered #brand.noin .ch{opacity:1;animation:none}
@keyframes chIn{from{opacity:0;transform:translateY(70px) rotateX(-100deg) scale(.5);filter:blur(16px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes wave{0%,62%,100%{color:#fff;text-shadow:0 0 0 transparent}30%{color:var(--acc);text-shadow:0 0 16px var(--glow),0 0 44px var(--glow)}}
#logoBox .logo{opacity:0}
body.entered #logoBox .logo{opacity:1;animation:logoIn 1.3s .05s cubic-bezier(.2,.9,.2,1.1) both}
@keyframes logoIn{from{opacity:0;transform:scale(.25) rotate(-30deg);filter:drop-shadow(0 0 10px var(--glow)) blur(16px)}}
body.entered header .sub{animation:fade 1s 1.3s backwards}

.navwrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:center;gap:12px;padding:14px 12px}
.nav{display:flex;align-items:center;gap:2px;padding:6px;border-radius:999px;background:rgba(22,22,26,.85);backdrop-filter:blur(12px);border:1px solid var(--line);max-width:100%;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--ink);font:600 13px/1 var(--fb);letter-spacing:.06em;text-transform:uppercase;padding:11px 16px;border-radius:999px;cursor:pointer}
.tab em{font-style:normal;font-size:10px;padding:3px 7px;border-radius:999px;background:rgba(255,255,255,.12)}
.tab[aria-pressed="true"]{background:var(--acc);color:#fff}
.tab[aria-pressed="true"] em{background:rgba(0,0,0,.25)}
.sbtn{flex:none;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:rgba(22,22,26,.85);color:#fff;cursor:pointer;display:grid;place-items:center}
.sbox{display:none;align-items:center}
.sbox.on{display:flex}
input[type=search],.fld,select.fld{font:500 14px var(--fb);color:#fff;background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.sbox input{border-radius:999px;padding:13px 18px;width:min(240px,50vw)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{max-width:1240px;margin:0 auto;padding:30px 24px 60px}
section{margin-bottom:56px}
h2{font-family:var(--fh);display:flex;align-items:baseline;gap:12px;margin:0 0 22px;padding-bottom:14px;border-bottom:1px solid var(--line);font-size:36px;font-weight:800;text-transform:uppercase}
h2 small{font-size:13px;font-weight:600;color:var(--acc);letter-spacing:.08em}
.cards{display:grid;gap:16px;grid-template-columns:repeat(3,1fr)}
.cards.two{grid-template-columns:repeat(2,minmax(0,400px));justify-content:center}
@media (max-width:980px){.cards{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.cards,.cards.two{grid-template-columns:1fr}h2{font-size:28px}main{padding:20px 14px 40px}}
.card{position:relative;display:flex;align-items:center;gap:16px;padding:18px;border-radius:16px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--line);transition:border-color .2s,box-shadow .2s,transform .15s ease-out;will-change:transform}
.card:hover{border-color:var(--rc);box-shadow:0 0 22px -6px var(--rc)}
.card:before,.card:after{content:"";position:absolute;right:10px;width:11px;height:11px;border:0 solid rgba(255,255,255,.3)}
.card:before{top:10px;border-top-width:1px;border-right-width:1px;border-top-right-radius:4px}
.card:after{bottom:10px;border-bottom-width:1px;border-right-width:1px;border-bottom-right-radius:4px}
.founder{--rc:#ff3345}.leader{--rc:#e6e8ec}.support{--rc:#9aa0a8}.member{--rc:#c4414d}
.av{position:relative;flex:none;width:64px;height:64px;border-radius:50%;border:2.5px solid var(--rc);box-shadow:0 0 14px -2px var(--rc);display:grid;place-items:center;font-weight:700;font-size:22px;background:radial-gradient(circle at 30% 25%,#34343c,#0f0f12)}
.av img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover}
.dot{position:absolute;right:-2px;bottom:-2px;width:18px;height:18px;border-radius:50%;border:2px solid #0a0a0a;background:#2fd37f;display:grid;place-items:center}
.dot.off{background:#e0344a}
.dot.off:after{content:"";width:8px;height:2px;background:#fff;border-radius:1px}
.info{min-width:0}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--rc);background:color-mix(in srgb,var(--rc) 16%,transparent);border:1px solid color-mix(in srgb,var(--rc) 40%,transparent)}
.badge:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.nm{margin:6px 0 8px;font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb{display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 5px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:#dcdde0;font-size:12px;text-decoration:none}
.fb i{width:17px;height:17px;border-radius:50%;background:#4a4e57;color:#fff;font:700 11px/17px var(--fb);text-align:center;font-style:normal}
.empty{text-align:center;color:var(--muted);padding:60px 0}
footer{position:relative;z-index:2;text-align:center;padding:0 0 190px}
.adminlink{background:none;border:1px solid var(--line);color:var(--muted);font-size:12px;padding:8px 16px;border-radius:999px;cursor:pointer}
.adminlink:hover{color:#fff;border-color:var(--acc)}
.credit{margin:18px 0 0;font-size:13px;color:var(--muted);letter-spacing:.08em}
.credit b{color:var(--acc);font-weight:700}
.orbs i{position:fixed;width:50vmax;height:50vmax;border-radius:50%;filter:blur(90px);opacity:.2;z-index:0;pointer-events:none;background:var(--acc);animation:float 18s ease-in-out infinite alternate}
.orbs i:nth-child(1){left:-15vmax;top:-12vmax}
.orbs i:nth-child(2){right:-18vmax;bottom:-18vmax;background:#5b606a;animation-duration:25s}
@keyframes float{to{transform:translate(9vmax,7vmax) scale(1.18)}}

/* ===== เครื่องเล่นเพลง ===== */
.player{position:fixed;z-index:30;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:330px;padding:16px 18px 18px;border-radius:22px;background:rgba(16,10,11,.94);border:1px solid color-mix(in srgb,var(--acc) 50%,transparent);box-shadow:0 0 34px -4px var(--glow);backdrop-filter:blur(14px)}
@media (max-width:640px){.player{right:12px;left:12px;width:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px))}}
.player.none{display:none}
.ph{display:flex;align-items:center;gap:10px;color:var(--acc);font-size:11px;font-weight:700;letter-spacing:.2em}
.ph .ic{width:28px;height:28px;border-radius:8px;background:color-mix(in srgb,var(--acc) 20%,transparent);display:grid;place-items:center}
.ph .grow{flex:1}
.pc{border:0;background:none;color:#c3c5ca;cursor:pointer;padding:6px;border-radius:50%;display:grid;place-items:center}
.pc:hover{color:#fff}.pc.on{color:var(--acc)}
.pbody{margin-top:16px}
.player.min .pbody{display:none}
.player.min .chev{transform:rotate(180deg)}
.track{display:flex;gap:14px;align-items:center}
.disc{flex:none;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,#0a0a0a 0 10%,var(--acc) 11% 14%,#26262b 15% 38%,#5a1a21 39% 70%,#141416 71%);box-shadow:0 0 18px var(--glow)}
.spin .disc{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tt{min-width:0}
.tt b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt span{display:block;color:#b9bdc4;font-size:13px;margin:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt small{color:var(--acc);font-size:10px;letter-spacing:.16em}
.prog{margin-top:18px}
.prog input,.volr input{width:100%;accent-color:var(--acc);height:4px;cursor:pointer}
.times{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:2px}
.ctrls{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:12px}
.big{width:60px;height:60px;border-radius:50%;border:0;background:var(--acc);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 0 22px var(--glow)}
.volr{display:flex;align-items:center;gap:10px;margin-top:16px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.06);font-size:11px;font-weight:700}
.plist{margin-top:12px;max-height:150px;overflow-y:auto;border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:2px}
.plist[hidden]{display:none}
.pli{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:none;color:#c3c5ca;padding:7px 8px;border-radius:8px;font-size:13px;cursor:pointer;width:100%}
.pli:hover{background:rgba(255,255,255,.06)}
.pli.on{color:#fff;background:color-mix(in srgb,var(--acc) 22%,transparent)}
.pli.bad{opacity:.5;text-decoration:line-through}
.pn{flex:none;width:18px;color:var(--acc);font-weight:700;font-size:11px}
.pt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ytwrap{position:fixed;left:0;bottom:0;width:200px;height:200px;opacity:.01;pointer-events:none;z-index:-1;overflow:hidden}
.ytwrap iframe{width:200px;height:200px;border:0}

/* ===== แอดมิน ===== */
.drawer{position:fixed;z-index:60;top:0;right:0;bottom:0;width:min(450px,100vw);background:#121215;border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .25s;padding-top:env(safe-area-inset-top,0px)}
.drawer.open{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700}
.dh small{color:var(--muted);font-weight:500}
.dtabs{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);overflow-x:auto}
.dtabs button{flex:none;border:1px solid var(--line);background:none;color:var(--ink);padding:7px 14px;border-radius:999px;font-size:13px;cursor:pointer}
.dtabs button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc)}
.dbody{flex:1;overflow-y:auto;padding:16px}
.lab{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
.row{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.row .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.rt{display:flex;gap:10px;align-items:center}
.thumb{width:40px;height:40px;border-radius:50%;background:var(--surf2);flex:none;object-fit:cover;display:grid;place-items:center;font-weight:700}
.btn{border:1px solid var(--line);background:var(--surf2);color:#fff;font-size:13px;padding:8px 12px;border-radius:10px;cursor:pointer}
.btn.red{background:var(--acc);border-color:var(--acc);font-weight:600}
.btn.del{color:#ff7a86}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.chk{display:flex;gap:6px;align-items:center;font-size:13px}
.dfoot{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.dfoot .btn{flex:1;padding:12px}
.lstat{margin-top:8px;font-size:12px;line-height:1.5}
.lstat.yt,.lstat.audio{color:#4ade80}
.lstat.bad{color:#ff7a86}
.lstat.none{color:var(--muted)}
.scrim{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.6);display:none}
.scrim.on{display:block}
.modal{position:fixed;z-index:70;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,92vw);background:#121215;border:1px solid var(--line);border-radius:16px;padding:22px;display:none}
.modal.on{display:block}
.modal h3{margin:0 0 4px;font-size:18px}
.modal p{margin:0 0 14px;color:var(--muted);font-size:13px}
.err{color:#ff7a86;font-size:13px;min-height:18px;margin-top:8px}
.toast{position:fixed;z-index:120;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222228;border:1px solid var(--acc);padding:10px 18px;border-radius:999px;font-size:14px;display:none;max-width:92vw;text-align:center}
.toast.on{display:block}

/* ===== หน้าเปิด (Intro) ===== */
.splash{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 45%,#2a070c 0,#080304 55%,#020202 100%);display:grid;place-items:center;text-align:center;overflow:hidden;overflow:clip;contain:paint;clip-path:circle(150% at 50% 45%);transition:clip-path 1.05s cubic-bezier(.76,0,.2,1),opacity .4s .8s}
.splash.out{clip-path:circle(0% at 50% 45%);opacity:0;pointer-events:none}
.splash.gone{display:none}
#fx{position:absolute;inset:0;width:100%;height:100%}
.grid3d{position:absolute;left:-60%;right:-60%;top:56%;bottom:-45%;background-image:linear-gradient(rgba(225,29,46,.4) 1px,transparent 1px),linear-gradient(90deg,rgba(225,29,46,.4) 1px,transparent 1px);background-size:64px 64px;transform:perspective(420px) rotateX(64deg);transform-origin:50% 0;animation:gridmove 1.4s linear infinite;-webkit-mask:linear-gradient(to bottom,transparent 0,#000 55%);mask:linear-gradient(to bottom,transparent 0,#000 55%)}
@keyframes gridmove{to{background-position:0 64px}}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.8));pointer-events:none}
.lines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px);mix-blend-mode:overlay;pointer-events:none;animation:flick .12s steps(2) infinite}
@keyframes flick{50%{opacity:.6}}
.scan{position:absolute;left:0;right:0;top:-4px;height:2px;background:var(--acc);box-shadow:0 0 24px 6px var(--glow);animation:scan 2.4s ease-in .4s forwards}
@keyframes scan{to{top:105%}}
.flare{position:absolute;left:0;right:0;top:45%;height:2px;background:linear-gradient(90deg,transparent,var(--acc),#fff,var(--acc),transparent);opacity:0;animation:flare 1.4s 1.1s ease-out}
@keyframes flare{0%{opacity:0;transform:scaleX(0)}35%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1)}}
.corner{position:absolute;width:48px;height:48px;border:2px solid var(--acc);opacity:.85;animation:fade 1s 1.2s backwards}
.corner.tl{left:22px;top:calc(22px + env(safe-area-inset-top,0px));border-right:0;border-bottom:0}
.corner.tr{right:22px;top:calc(22px + env(safe-area-inset-top,0px));border-left:0;border-bottom:0}
.corner.bl{left:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));border-right:0;border-top:0}
.corner.br{right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));border-left:0;border-top:0}
.hud{position:absolute;font:600 10px var(--fb);letter-spacing:.22em;color:#8b8f97;animation:fade 1s 1.6s backwards;text-transform:uppercase}
.hud.tl{left:84px;top:calc(34px + env(safe-area-inset-top,0px))}
.hud.tr{right:84px;top:calc(34px + env(safe-area-inset-top,0px))}
.hud.bl{left:84px;bottom:calc(34px + env(safe-area-inset-bottom,0px))}
.hud.br{right:84px;bottom:calc(34px + env(safe-area-inset-bottom,0px));color:var(--acc)}
@media (max-width:640px){.hud.tr,.hud.br,.hud.bl{display:none}.hud.tl,.hud.bl{left:78px;font-size:9px}}
.sin{position:relative;padding:20px;max-width:100%}
.ringw{position:relative;width:min(300px,64vw,34vh);height:min(300px,64vw,34vh);margin:0 auto 30px}
.rays{position:absolute;inset:-70%;background:repeating-conic-gradient(rgba(225,29,46,0) 0 8deg,rgba(225,29,46,.24) 9deg 11deg,rgba(225,29,46,0) 12deg 20deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 60%);mask:radial-gradient(circle,#000 0,transparent 60%);animation:rot 24s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.hudsvg{position:absolute;left:-6%;top:-6%;width:112%;height:112%;overflow:visible}
.hudsvg circle,.hudsvg g{fill:none;transform-box:fill-box;transform-origin:center}
.hudsvg .c1{stroke:var(--acc);stroke-width:2;stroke-dasharray:110 493;animation:rot 2.2s linear infinite;filter:drop-shadow(0 0 5px var(--acc))}
.hudsvg .c2{stroke:rgba(255,255,255,.4);stroke-width:1;stroke-dasharray:2 7;animation:rot 26s linear infinite reverse}
.hudsvg .c3{stroke:var(--acc);stroke-width:1.2;stroke-dasharray:44 30;opacity:.7;animation:rot 9s linear infinite reverse}
.hudsvg .tickg{animation:rot 40s linear infinite}
.hudsvg .tk{stroke:rgba(255,255,255,.35);stroke-width:1}
.hudsvg .tk.big{stroke:var(--acc);stroke-width:1.6}
.wave{position:absolute;inset:0;border-radius:50%;border:2px solid var(--acc);opacity:0;animation:wave 2.8s ease-out infinite}
.wave.w2{animation-delay:1.4s}
@keyframes wave{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2);opacity:0}}
.slogo{position:absolute;inset:0;display:grid;place-items:center;z-index:2}
.slogo .logo{width:54%;height:54%;margin:0;animation:pop 1.2s .3s backwards,pulse2 3s 1.6s ease-in-out infinite}
@keyframes pop{from{opacity:0;transform:scale(.3);filter:drop-shadow(0 0 10px var(--glow)) blur(14px)}}
@keyframes pulse2{50%{transform:scale(1.07);filter:drop-shadow(0 0 22px var(--acc))}}
.slogo svg path{stroke-dasharray:260;animation:draw 1.8s .3s backwards}
@keyframes draw{from{stroke-dashoffset:260}}
.gl{max-width:100%;overflow-wrap:anywhere;position:relative;margin:0;font-size:clamp(34px,10vw,110px);letter-spacing:.12em;line-height:1.05;text-shadow:0 0 40px var(--glow)}
.gl:before,.gl:after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;opacity:0;animation:glitch 3.2s 2.4s infinite}
.gl:before{color:var(--acc)}
.gl:after{color:#9aa0a8;animation-delay:2.47s}

}

var FONTS = [
 ["Kanit","wght@400;500;600;700;800",1],["Prompt","wght@400;500;600;700;800",1],["Mitr","wght@400;500;600;700",1],["Sarabun","wght@400;500;600;700;800",1],

 ["Mali","wght@400;500;600;700",1],["Itim","",1],["Sriracha","",1],["Pattaya","",1],
 ["Outfit","wght@400;500;600;700;800",0],["Orbitron","wght@400;500;600;700;800;900",0],["Rajdhani","wght@400;500;600;700",0],["Oswald","wght@400;500;600;700",0],

];

/* ลูกเล่นชื่อแก๊งค์: เอียง 3D ตามเมาส์ + ตัวอักษรลอยตามเคอร์เซอร์ */
(function(){
  var hd = $("hd"), tw = $("tw");
  hd.addEventListener("pointermove", function(e){
    if(e.pointerType==="touch" || reducedNow()) return;
    var r = hd.getBoundingClientRect();
    tw.style.setProperty("--ry", (((e.clientX-r.left)/r.width-.5)*14).toFixed(2)+"deg");
    tw.style.setProperty("--rx", ((-((e.clientY-r.top)/r.height-.5))*10).toFixed(2)+"deg");
    var cs = $("brand").querySelectorAll(".ch");
    for(var i=0;i<cs.length;i++){
      var b = cs[i].getBoundingClientRect(), dx = e.clientX-(b.left+b.width/2), dy = e.clientY-(b.top+b.height/2), k = Math.max(0, 1-Math.sqrt(dx*dx+dy*dy)/150);
      cs[i].style.translate = "0 "+(-k*18).toFixed(1)+"px"; cs[i].style.scale = (1+k*.28).toFixed(3);
    }
  });

/* แปลงลิงก์ให้เล่นได้ */
function parseSrc(u){
  u = (u||"").trim(); if(!u) return {k:"none"};
  if(LOCAL[u]) return {k:"audio", url:LOCAL[u], local:true};
  var m = /(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/|v\/)|music\.youtube\.com\/watch\?(?:[^#]*&)?v=)([\w-]{11})/.exec(u);
  if(m) return {k:"yt", id:m[1]};
  if(/soundcloud\.com|spotify\.com|apple\.com\/.*music|joox|tiktok\.com/i.test(u)) return {k:"bad", why:"ลิงก์เว็บเพลงนี้เล่นตรงไม่ได้ ใช้ลิงก์ YouTube หรือไฟล์ .mp3 แทน"};
  m = /drive\.google\.com\/file\/d\/([\w-]+)/.exec(u) || /drive\.google\.com\/(?:open|uc)\?(?:[^#]*&)?id=([\w-]+)/.exec(u);
  if(m) return {k:"audio", url:"https://drive.google.com/uc?export=download&id="+m[1], warn:"Google Drive ต้องแชร์แบบ \"ทุกคนที่มีลิงก์\" และไฟล์ไม่ใหญ่มาก (ถ้าไม่เล่น ใช้ YouTube แทนจะชัวร์กว่า)"};
  if(/^https?:\/\/(www\.)?dropbox\.com\//i.test(u)){
    var d = u.replace(/^https?:\/\/(www\.)?dropbox\.com/i, "https://dl.dropboxusercontent.com");
    d = /[?&]dl=\d/.test(d) ? d.replace(/([?&])dl=\d/, "$1dl=1") : d + (d.indexOf("?")>-1 ? "&" : "?") + "dl=1";
    return {k:"audio", url:d};
  }
  m = /^https?:\/\/github\.com\/([^\/]+)\/([^\/]+)\/blob\/(.+)$/i.exec(u);
  if(m) return {k:"audio", url:"https://raw.githubusercontent.com/"+m[1]+"/"+m[2]+"/"+m[3].replace(/\?.*$/, "")};
  if(/^https?:\/\//i.test(u)) return {k:"audio", url:u.replace(/^http:/i, "https:")};
  if(/^[\w\-.\/%]+\.(mp3|m4a|ogg|wav|aac)$/i.test(u)) return {k:"audio", url:u, local:true};
  return {k:"bad", why:"ลิงก์ต้องขึ้นต้นด้วย https:// หรือเป็นไฟล์ที่อัปโหลดไว้"};
}

/* YouTube */
function ytApi(cb){
  if(window.YT && YT.Player) return cb();
  (ytApi.q = ytApi.q || []).push(cb); if(ytApi.s) return; ytApi.s = 1;
  window.onYouTubeIframeAPIReady = function(){ (ytApi.q||[]).splice(0).forEach(function(f){ f(); }); };
  var s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api";
  s.onerror = function(){ ytApi.s = 0; if(P.kind==="yt") fail("โหลดตัวเล่น YouTube ไม่ได้ (ถูกบล็อกหรือไม่มีเน็ต)"); };
  document.head.appendChild(s);
}
function ytSet(id, play){
  Y.id = id;
  if(Y.p && Y.ready){ try{ play ? Y.p.loadVideoById(id) : Y.p.cueVideoById(id); }catch(e){} return; }
  if(Y.p) return;
  stat("LOADING...");
  ytApi(function(){
    if(Y.p) return;
    var pv = {playsinline:1, controls:0, disablekb:1, rel:0, modestbranding:1}; if(/^https?:$/.test(location.protocol)) pv.origin = location.origin;
    Y.p = new YT.Player("ytp", {width:200, height:200, videoId:Y.id, playerVars:pv, events:{
      onReady:function(){
        Y.ready = true; applyVol();
        if(P.kind==="yt"){
          try{ P.playing ? Y.p.loadVideoById(Y.id) : Y.p.cueVideoById(Y.id); }catch(e){} stat();
          setTimeout(function(){ try{ var st = Y.p.getPlayerState(); if(P.playing && P.kind==="yt" && st!==1 && st!==3){ setPlaying(false); toast("กดปุ่มเล่นเพื่อเริ่มเพลง"); } }catch(e){} }, 3000);
        }
      },
      onStateChange:function(e){
        if(P.kind!=="yt") return; var s = e.data;
        if(s===1){ P.fails = 0; stat(); } else if(s===3 && P.playing) stat("BUFFERING..."); else if(s===0) onEnd();
        paint();
      },
      onError:function(e){
        if(P.kind!=="yt") return; var c = e.data;
        fail(c===100 ? "วิดีโอถูกลบหรือเป็นส่วนตัว" : (c===101||c===150) ? "เจ้าของวิดีโอไม่อนุญาตให้ฝังเล่น" : "ลิงก์ YouTube ไม่ถูกต้อง");
      }
    }});
  });
}

function stopAll(){

}
function doPlay(){

  } else if(P.kind==="yt" && Y.ready){ try{ Y.p.playVideo(); }catch(e){} }
}

function doSeek(s){ try{ if(P.kind==="audio") A.currentTime = s; else if(P.kind==="yt" && Y.ready) Y.p.seekTo(s, true); }catch(e){} }

}
function setPlaying(v){

function nextIdx(){
  var n = S.tracks.length;
  if(P.shuf && n>1){ var r; do{ r = Math.floor(Math.random()*n); }while(r===P.i); return r; }
  return (P.i+1) % n;

function fail(msg){
  var t = S.tracks[P.i] || {}, tok = P.tok, n = S.tracks.length;
  P.bad[P.i] = msg; stat("ERROR"); drawList();
  toast("เล่น \u201C" + (t.t||"เพลง") + "\u201D ไม่ได้: " + msg);

  else setPlaying(false);
}
function onEnd(){
  if(P.rep){ doSeek(0); doPlay(); return; }

function loadTrack(i, play){
  var T = S.tracks; $("player").classList.toggle("none", !T.length);

  P.i = ((i % T.length) + T.length) % T.length; P.pos = 0; P.tok++; delete P.bad[P.i];
  var t = T[P.i], s = parseSrc(t.src); stopAll(); P.kind = s.k; showInfo();
  if(s.k==="audio"){ A.src = s.url; applyVol(); }
  else if(s.k==="yt"){ ytSet(s.id, !!play); }

var GH = {o:"", r:""};

function ghErr(e){ if(e.status===401||e.status===403||/not accessible/i.test(e.msg||"")) return "Token ไม่มีสิทธิ์เขียน (ต้องตั้ง Contents: Read and write และเลือก repo นี้)"; return e.msg || "ไม่ทราบสาเหตุ"; }
function b64(str){ return btoa(unescape(encodeURIComponent(str))); }
function api(path, opt){
  opt = opt || {}; opt.headers = {"Authorization":"Bearer "+TOKEN,"Accept":"application/vnd.github+json"};
  if(opt.body) opt.headers["Content-Type"] = "application/json";
  return fetch("https://api.github.com/repos/"+GH.o+"/"+GH.r+(path?"/"+path:""), opt).then(function(r){
    return r.json().then(function(j){ if(!r.ok) throw {status:r.status,msg:j.message}; return j; }, function(){ if(!r.ok) throw {status:r.status}; return {}; });
  });
}
function commit(path, content64, msg){

    var body = {message:msg, content:content64}; if(sha) body.sha = sha;
    return api("contents/"+path, {method:"PUT", body:JSON.stringify(body)});

function upload(file, max, fj){
  return new Promise(function(res){
    var fr = new FileReader();
    fr.onload = function(){
      var im = new Image();
      im.onload = function(){
        var k = Math.min(1, max/Math.max(im.width, im.height)), c = document.createElement("canvas");
        c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        var jpg = fj || file.type==="image/jpeg", url = c.toDataURL(jpg?"image/jpeg":"image/png", .85), path = "img/" + Date.now() + (jpg?".jpg":".png");
        toast("กำลังอัปโหลด...");
        commit(path, url.split(",")[1], "upload image").then(function(){ LOCAL[path] = url; res(path); })
          .catch(function(e){ toast("อัปโหลดไม่สำเร็จ: " + ghErr(e)); res(null); });
      };
      im.onerror = function(){ toast("ไฟล์รูปไม่ถูกต้อง"); res(null); };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

    streaks.forEach(function(s){
      s.x += s.v; if(s.x > fxc.width+s.l){ s.x = -s.l; s.y = Math.random()*fxc.height; }
      var g = ctx.createLinearGradient(s.x-s.l, 0, s.x, 0); g.addColorStop(0, "rgba(225,29,46,0)"); g.addColorStop(1, S.accent);
      ctx.globalAlpha = .55; ctx.fillStyle = g; ctx.fillRect(s.x-s.l, s.y, s.l, 1.5);
    });
    requestAnimationFrame(loop);
  })();
}
function scramble(){
  var el = $("sName"), txt = S.brand, cl = clusters(txt), CH = "ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#%&@$", t0 = Date.now();
  SP.scr = true;
  (function step(){
    var p = (Date.now()-t0-700)/1700;
    var out = cl.map(function(c, i){ return (c===" " || i/cl.length < p) ? c : CH.charAt(Math.random()*CH.length|0); }).join("");
    el.textContent = out; el.setAttribute("data-text", out);
    if(p > -.1 && p < 1 && sfxLive() && Date.now()-SP.lastC > 70){ SP.lastC = Date.now(); sfxCrackle(); }
    if(p < 1 && fxOn) requestAnimationFrame(step);
    else { el.textContent = txt; el.setAttribute("data-text", txt); SP.scr = false; }
  })();
}
function prog(p){
  $("pct").textContent = p + "%";
  var segs = $("lbar").children, n = Math.round(p/100*segs.length);
  SP.p = p; droneP(p); if(n !== SP.n){ SP.n = n; if(n>0 && sfxLive()) sfxTick(p); }
  for(var i=0;i<segs.length;i++) segs[i].className = i<n ? "on" : "";
  while(SP.b < BOOT.length && p >= BOOT[SP.b][0]){
    var bx = $("boot"), row = h("div",{},[h("span",{},["> "+BOOT[SP.b][1]]), h("b",{},[SP.b===BOOT.length-1 ? "OK" : "..."])]);
    var last = bx.lastChild; if(last && last.lastChild) last.lastChild.textContent = "OK";
    if(sfxLive()) sfxBlip();
    bx.appendChild(row); while(bx.children.length>5) bx.removeChild(bx.firstChild); SP.b++;
  }
}
function startSplash(){
  if(!S.splash){ splash.classList.add("gone"); document.body.classList.add("entered"); return; }
  var quick = reducedNow();
  splash.classList.add("go"); document.body.style.overflow = "hidden";
  SP.loading = true; if(S.sfx!==false){ sfxUnlock(); sfxState(); if(sfxLive()) sfxStart(); }
  if(!quick){ runFx(); scramble(); }
  var t0 = Date.now(), dur = quick ? 500 : 4200, pre = false; preload().then(function(){ pre = true; });
  var iv = setInterval(function(){
    var x = Math.min(1, (Date.now()-t0)/dur), p = Math.round(100*x*x*(3-2*x));
    if(!pre) p = Math.min(p, 96);
    prog(p);
    if(p>=100){ clearInterval(iv); $("lmsg").textContent = "SYSTEM READY"; SP.loading = false; stopDrone(); if(sfxLive()) sfxReady(); sfxState(); splash.classList.add("ready"); splash.scrollLeft = 0; splash.scrollTop = 0; $("enterBtn").focus({preventScroll:true}); splash.scrollLeft = 0; splash.scrollTop = 0; }
  }, 40);
}
function doEnter(){
  if(SP.entering) return; SP.entering = true;
  sfxEnterNow();
  var quick = reducedNow();
  splash.classList.add("blast");
  setTimeout(function(){ splash.classList.add("out"); document.body.classList.add("entered"); document.body.style.overflow = ""; }, quick ? 0 : 380);
  setTimeout(function(){ splash.classList.add("gone"); fxOn = false; }, quick ? 50 : 1600);
  if(S.tracks.length && (P.kind==="audio" || P.kind==="yt")) setPlaying(true);
}
$("enterBtn").onclick = doEnter;
function inSfx(e){ return !!(e.target && e.target.closest && e.target.closest("#sfxBtn")); }
splash.addEventListener("click", function(e){ if(splash.classList.contains("ready") && !inSfx(e)) doEnter(); });
splash.addEventListener("touchend", function(e){ if(splash.classList.contains("ready") && !inSfx(e)){ e.preventDefault(); doEnter(); } }, {passive:false});

/* ===== หิมะ (เกล็ดหิมะจริง เบา ไม่ตาลาย) ===== */
var SNOW = {on:false, gen:0, c:null, bound:false};
function flakeSprite(R, variant){
  var d = window.devicePixelRatio || 1, c = document.createElement("canvas"), n = Math.ceil((R*2+14)*d); c.width = c.height = n;
  var x = c.getContext("2d"); x.translate(n/2, n/2); x.scale(d, d);
  x.strokeStyle = "#fff"; x.fillStyle = "#fff"; x.lineCap = "round"; x.lineWidth = Math.max(.9, R/9);
  x.shadowColor = "rgba(190,220,255,.9)"; x.shadowBlur = Math.max(2, R/3)*d;
  for(var i=0;i<6;i++){
    x.save(); x.rotate(i*Math.PI/3);
    x.beginPath(); x.moveTo(0,0); x.lineTo(0,-R); x.stroke();
    (variant===1 ? [.38,.68] : [.55]).forEach(function(p){
      var l = R*(variant===2 ? .36 : .3);
      x.beginPath(); x.moveTo(-l*.75, -R*p-l*.75); x.lineTo(0, -R*p); x.lineTo(l*.75, -R*p-l*.75); x.stroke();
    });
    if(variant===2){ x.beginPath(); x.moveTo(0,-R*.82); x.lineTo(-R*.09,-R*.92); x.lineTo(0,-R*1.02); x.lineTo(R*.09,-R*.92); x.closePath(); x.fill(); }
    x.restore();
  }
  x.beginPath(); x.arc(0,0,Math.max(1,R*.12),0,6.283); x.fill();
  return c;
}
function mkFlake(top, H, W, sprites){
  var crystal = Math.random() < .55, R = crystal ? 6 + Math.pow(Math.random(),1.6)*14 : 0;
  var f = {x:Math.random()*W, y: top ? Math.random()*H : -30, sw:Math.random()*6.28, sp:.004 + Math.random()*.008, crystal:crystal};
  if(crystal){
    var sz = R<9 ? 0 : R<14 ? 1 : 2, vr = Math.floor(Math.random()*3); f.sp_ = sprites[sz][vr]; f.R = R;
    f.v = .3 + R*.022; f.rot = Math.random()*6.28; f.rv = (Math.random()-.5)*.006; f.a = .5 + Math.random()*.4; f.k = R/sprites.R[sz];
  } else { f.r = .8 + Math.random()*1.5; f.v = .35 + Math.random()*.45; f.a = .3 + Math.random()*.4; }
  return f;
}
function setSnow(){
  var box = $("snow");
  if(!S.snow || reducedNow()){ SNOW.on = false; SNOW.gen++; box.innerHTML = ""; return; }
  if(SNOW.on) return;
  SNOW.on = true; var gen = ++SNOW.gen; box.innerHTML = "";
  var c = h("canvas"), ctx = c.getContext("2d"), flakes = []; SNOW.c = c; box.appendChild(c);
  function size(){ if(SNOW.c){ SNOW.c.width = innerWidth; SNOW.c.height = innerHeight; } } size();
  if(!SNOW.bound){ SNOW.bound = true; addEventListener("resize", size); }
  var sprites = [[0,1,2].map(function(v){ return flakeSprite(8, v); }), [0,1,2].map(function(v){ return flakeSprite(13, v); }), [0,1,2].map(function(v){ return flakeSprite(20, v); })];
  sprites.R = [8,13,20];
  var dpr = window.devicePixelRatio || 1;
  for(var i=0;i<(innerWidth<700?34:58);i++) flakes.push(mkFlake(true, c.height, c.width, sprites));
  (function loop(){
    if(gen !== SNOW.gen) return;
    ctx.clearRect(0,0,c.width,c.height);
    flakes.forEach(function(f, i){
      f.y += f.v; f.sw += f.sp*2.2; f.x += Math.sin(f.sw)*.35 + .08;
      if(f.y > c.height+30 || f.x > c.width+30){ flakes[i] = mkFlake(false, c.height, c.width, sprites); return; }
      ctx.globalAlpha = f.a;
      if(f.crystal){
        f.rot += f.rv; var w = f.sp_.width/dpr*f.k, hh = f.sp_.height/dpr*f.k;
        ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot); ctx.drawImage(f.sp_, -w/2, -hh/2, w, hh); ctx.restore();
      } else { ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283); ctx.fill(); }
    });
    ctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  })();
}
var mainEl = $("main");
mainEl.addEventListener("pointermove", function(e){
  var c = e.target.closest && e.target.closest(".card"); if(!c || reducedNow() || e.pointerType==="touch") return;
  var r = c.getBoundingClientRect(), x = (e.clientX-r.left)/r.width-.5, y = (e.clientY-r.top)/r.height-.5;
  c.style.transform = "perspective(700px) rotateY("+(x*9)+"deg) rotateX("+(-y*9)+"deg) translateY(-2px)";
});
mainEl.addEventListener("pointerout", function(e){ var c = e.target.closest && e.target.closest(".card"); if(c && !c.contains(e.relatedTarget)) c.style.transform = ""; });
